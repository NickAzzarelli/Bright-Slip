<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bright Slip</title>
  <meta name="description" content="Draw a fortune. Buy a pack of credits or go unlimited." />
  <meta property="og:title" content="Bright Slip" />
  <meta property="og:description" content="Draw a fortune. Buy a pack of credits or go unlimited." />
  <meta property="og:type" content="website" />

  <!-- PWA: installable on phones via "Add to Home Screen" -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Bright Slip" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <div class="top-row">
      <p class="eyebrow">Bright Slip</p>
      <button id="favorites-open" class="fav-icon-btn" aria-label="My favorites">
        ☆<span class="fav-badge hidden" id="fav-badge">0</span>
      </button>
    </div>

    <div class="categories" id="categories">
      <button class="cat-btn active" data-category="">All</button>
      <button class="cat-btn" data-category="love">Love</button>
      <button class="cat-btn" data-category="career">Career</button>
      <button class="cat-btn" data-category="luck">Luck</button>
    </div>

    <div class="fortune-display" id="fortune-display">
      <p class="fortune-placeholder">Your fortune will appear here.</p>
    </div>

    <button id="favorite-btn" class="secondary-btn hidden">☆ Save this one</button>
    <button id="share-btn" class="secondary-btn hidden">Share this fortune</button>

    <button id="get-fortune" class="primary-btn">Get a fortune — 1 credit</button>
    <p class="credit-line" id="credit-line">You have <span id="credit-count">…</span> credits</p>

    <hr />

    <div class="packs" id="packs">
      <!-- populated by app.js -->
    </div>
    <button id="subscribe-btn" class="subscribe-btn"></button>

    <hr />

    <div class="account" id="account-section">
      <!-- populated by app.js -->
    </div>

    <hr />

    <div class="referral">
      <p class="referral-copy">Give a friend a free fortune, get one yourself when they buy a pack.</p>
      <button id="copy-ref" class="secondary-btn">Copy your invite link</button>
    </div>

    <p class="footnote" id="status-line"></p>
  </main>

  <canvas id="share-canvas" width="800" height="800" style="display:none;"></canvas>

  <div id="favorites-overlay" class="favorites-overlay hidden">
    <div class="favorites-card">
      <div class="favorites-header">
        <p class="eyebrow">my favorites</p>
        <button class="cat-close" id="favorites-close" aria-label="Close">×</button>
      </div>
      <div class="favorites-list" id="favorites-list"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // Not fatal — the site still works fully without offline support.
        });
      });
    }
  </script>
</body>
</html>
